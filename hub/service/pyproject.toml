[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astr-auto-anima-hub"
version = "0.5.0b2"
description = "Workstation service for AstrBot, ComfyUI and AstrAutoAnima clients"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
  "Pillow>=10.4,<13",
  "cryptography>=44,<52",
]

[project.optional-dependencies]
dev = []

[project.scripts]
astr-auto-anima-hub = "astr_auto_anima_hub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
