name: public-validation

on:
  push:
  pull_request:

jobs:
  python-validation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Validate release and privacy boundary
        run: |
          python scripts/validate_release.py .
          python scripts/privacy_scan.py .
      - name: Test local managers
        run: python scripts/run_public_tests.py tools
      - name: Test training environment guard
        run: |
          python -m pip install "pytest>=8,<10"
          python -m pytest tools/tests/test_anima_training_env_guard.py -q -p no:cacheprovider
      - name: Test AstrBot plugin runtime
        env:
          PYTHONPATH: ${{ github.workspace }}/plugin
        run: |
          python -m pip install -r plugin/astrbot_plugin_comfy_bridge/requirements.txt
          python scripts/run_public_tests.py plugin --pytest
      - name: Install and test Hub
        run: |
          cp -R hub/service "$RUNNER_TEMP/aaa-hub-test-src"
          python -m pip install -e "$RUNNER_TEMP/aaa-hub-test-src"
          python scripts/run_public_tests.py hub --pytest
      - name: Recheck no runtime artifacts were produced in release tree
        run: python scripts/privacy_scan.py .
