name: public-validation

on:
  push:
  pull_request:

jobs:
  python-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate release and privacy boundary
        run: |
          python scripts/validate_release.py .
          python scripts/privacy_scan.py .
      - name: Test local managers
        run: python -m unittest discover -s tools/tests -v
      - name: Test AstrBot plugin runtime
        env:
          PYTHONPATH: ${{ github.workspace }}/plugin
        run: python -m unittest discover -s plugin/astrbot_plugin_comfy_bridge/tests -v
      - name: Install and test Hub
        run: |
          python -m pip install -e hub/service
          PYTHONPATH=hub/service/src python -m unittest discover -s hub/service/tests -v
