name: astr_auto_anima_hub_client
description: AstrAutoAnima Hub client for Web, Windows and Android
publish_to: "none"
version: 0.5.2-beta.1+44
environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  crypto: ^3.0.7
  qr_flutter: ^4.1.0
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  flutter_local_notifications: ^22.2.0
  file_picker: ^10.3.10
  path_provider: ^2.1.5
  public_file_saver: ^1.1.0
  saf: ^2.1.0
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.0.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tag_dict/zh_en_top50000.json
    - assets/tag_dict/LICENSE
    - assets/splash/oc_greeting_layered_atlas.png
    - assets/courtyard/light/
    - assets/courtyard/dark/
    - assets/courtyard/illustrations/
